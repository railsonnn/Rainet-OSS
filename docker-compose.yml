version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rainet
      POSTGRES_USER: rainet
      POSTGRES_PASSWORD: rainet
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rainet
      SPRING_DATASOURCE_USERNAME: rainet
      SPRING_DATASOURCE_PASSWORD: rainet
      SPRING_SERVLET_CONTEXT_PATH: /api
      JWT_SECRET: deprecated-jwt-removed-use-basic-auth
    ports:
      - "8080:8080"
    command: ["java","-jar","/app/app.jar"]
volumes:
  db_data:
